name: Publicar release do instalador Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Build (typecheck + main/preload + renderer)
        run: npm run build

      - name: Empacotar e publicar release no GitHub
        run: npx electron-builder --win nsis --publish always
        env:
          # O GITHUB_TOKEN automatico do Actions so' tem permissao neste
          # repositorio -- publicar em SistemaOperacoesCafe-releases (o repo
          # que o app instalado de fato consulta) exige um token proprio com
          # acesso aquele outro repositorio, guardado como secret.
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
