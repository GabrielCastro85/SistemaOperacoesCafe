name: Deploy mobile-viewer to GitHub Pages

on:
  push:
    branches: [master, codex/central-server-neon]
    paths:
      - "mobile-viewer/**"
      - ".github/workflows/mobile-viewer-pages.yml"
      - "web/**"
      - "src/renderer/**"
      - "src/shared/**"
      - "electron/preload/**"
      - "vite.web.config.ts"
      - "public/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile-viewer/package-lock.json
      - run: npm ci
        working-directory: mobile-viewer
      # Site antigo (consulta, melhor no celular) em /consulta/.
      - run: npx tsc -b && npx vite build --base=/consulta/
        working-directory: mobile-viewer
      # Site completo (mesmas telas do app) na raiz.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npx vite build --config vite.web.config.ts
      - name: Montar o site
        run: |
          mkdir -p site
          cp -r dist-web/. site/
          cp mobile-viewer/public/favicon.ico mobile-viewer/public/icon-*.png site/
          cp -r mobile-viewer/dist site/consulta
          mkdir -p site/app
          printf "<!doctype html><meta charset=utf-8><meta http-equiv=refresh content=\"0; url=/\"><script>location.replace(\"/\" + location.hash)</script>" > site/app/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
